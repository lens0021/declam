---
name: Tofu
on:
  pull_request:
    paths:
      - ".github/tf/**"
  push:
    branches:
      - main
    paths:
      - ".github/tf/**"

defaults:
  run:
    working-directory: .github/tf

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "No vuln fields"
            ignore_during_read: ""
            vulnerability_alerts: ""

          - name: "Only ignore_during_read=true"
            ignore_during_read: "ignore_vulnerability_alerts_during_read = true"
            vulnerability_alerts: ""

          - name: "ignore_during_read=true + vuln=false"
            ignore_during_read: "ignore_vulnerability_alerts_during_read = true"
            vulnerability_alerts: "vulnerability_alerts = false"

          - name: "ignore_during_read=true + vuln=true"
            ignore_during_read: "ignore_vulnerability_alerts_during_read = true"
            vulnerability_alerts: "vulnerability_alerts = true"

          - name: "Only vuln=false"
            ignore_during_read: ""
            vulnerability_alerts: "vulnerability_alerts = false"

    name: "Plan: ${{ matrix.name }}"

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.24'
          cache: false

      - name: Build terraform-provider-github
        working-directory: /tmp
        run: |
          git clone https://github.com/integrations/terraform-provider-github.git
          cd terraform-provider-github
          git checkout b0d23accbe7f8d887e96de9dac9e6326c66a3ab8
          CGO_ENABLED=0 go build -ldflags="-s -w" -o ${{ github.workspace }}/.github/tf/terraform-provider-github
          chmod +x ${{ github.workspace }}/.github/tf/terraform-provider-github
          echo "Built provider from:"
          git log -1 --oneline

      - name: Configure dev_overrides for custom provider
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ~/.config/opentofu
          cat > ~/.config/opentofu/tofurc << 'EOF'
          provider_installation {
            dev_overrides {
              "integrations/github" = "${{ github.workspace }}/.github/tf"
            }
            direct {}
          }
          EOF

      - name: Generate main.tf with test configuration
        run: |
          cat > main.tf << 'HCLEOF'
          terraform {
            required_version = "~> 1.0"
            backend "local" {}
            required_providers {
              github = {
                source  = "integrations/github"
                version = "~> 6.0"
              }
            }
          }

          provider "github" {
            owner = "lens0021"
          }

          import {
            id = "declam"
            to = github_repository.this
          }

          resource "github_repository" "this" {
            allow_auto_merge            = false
            allow_merge_commit          = false
            allow_rebase_merge          = false
            allow_squash_merge          = true
            allow_update_branch         = true
            archived                    = false
            archive_on_destroy          = true
            auto_init                   = false
            delete_branch_on_merge      = true
            description                 = ""
            has_discussions             = false
            has_issues                  = true
            has_projects                = false
            has_wiki                    = false
            homepage_url                = ""
            ${{ matrix.ignore_during_read }}
            name                        = "declam"
            squash_merge_commit_message = "BLANK"
            squash_merge_commit_title   = "PR_TITLE"
            topics                      = []
            visibility                  = "public"
            ${{ matrix.vulnerability_alerts }}
            web_commit_signoff_required = false
          }

          import {
            id = "declam"
            to = github_workflow_repository_permissions.this
          }

          resource "github_workflow_repository_permissions" "this" {
            repository                       = github_repository.this.name
            default_workflow_permissions     = "read"
            can_approve_pull_request_reviews = true
          }
          HCLEOF

          echo "=== Generated configuration: ${{ matrix.name }} ==="
          cat main.tf

      # Run Terraform operations
      - name: Initialize Tofu
        run: tofu init

      - name: Run Tofu plan
        id: plan
        continue-on-error: true
        run: tofu plan -no-color
        env:
          TF_LOG: DEBUG

      - name: Write test result to summary
        if: always()
        run: |
          OUTCOME="${{ steps.plan.outcome }}"
          if [ "$OUTCOME" == "success" ]; then
            ICON="✅"
            STATUS="SUCCESS - Plan completed"
          else
            ICON="❌"
            STATUS="FAILED - Plan errored"
          fi

          IGNORE_READ="${{ matrix.ignore_during_read }}"
          VULN_ALERTS="${{ matrix.vulnerability_alerts }}"

          {
            echo "### $ICON ${{ matrix.name }}"
            echo ""
            echo "**Provider:** \`b0d23acc\` (PR #3127)"
            echo ""
            echo "**Configuration:**"
            echo "- \`${IGNORE_READ:-(not set)}\`"
            echo "- \`${VULN_ALERTS:-(not set)}\`"
            echo ""
            echo "**Outcome:** $STATUS"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8

      - run: tofu init

      - run: tofu apply -auto-approve
